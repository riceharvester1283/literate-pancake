<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef2f1">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>At a glance</title>
<style>
  :root{
    --bg:#eef2f1; --card:#ffffff; --ink:#26343a; --muted:#6b7c83; --line:#e3eae9;
    --accent:#5b9aa0; --accent-soft:#e2f0f0; --good:#4f9d7a; --warn:#c9953a; --bad:#c26a6a;
    --shadow:0 1px 2px rgba(38,52,58,.05),0 8px 24px rgba(38,52,58,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141b1e; --card:#1c262a; --ink:#e6eeee; --muted:#8fa2a8; --line:#2a373c;
      --accent:#7fbdc3; --accent-soft:#223539; --good:#7cc4a0; --warn:#dcb06a; --bad:#d68a8a;
      --shadow:none;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg)}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:max(20px,env(safe-area-inset-top)) 18px 48px;max-width:560px;margin-inline:auto;line-height:1.4}
  header{margin:14px 4px 22px}
  .eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{font-size:2rem;font-weight:600;margin:6px 0 2px;letter-spacing:-.01em}
  .date{color:var(--muted);font-size:1rem}

  .card{background:var(--card);border-radius:24px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
  .label{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
    display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

  /* hero */
  .hero{background:linear-gradient(160deg,var(--accent-soft),var(--card) 75%)}
  .big{font-size:3rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--accent);line-height:1.1}
  .sub{color:var(--muted);margin-top:6px}
  .ring{height:6px;background:var(--line);border-radius:6px;margin-top:16px;overflow:hidden}
  .ring i{display:block;height:100%;width:0;background:var(--accent);border-radius:6px;transition:width 1s}

  .glance{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .glance .card{margin:0;padding:16px}
  .glance .v{font-size:1.15rem;font-weight:600;margin-top:2px}
  .glance .s{color:var(--muted);font-size:.88rem;margin-top:2px}
  @media (max-width:360px){.glance{grid-template-columns:1fr}}

  /* lists */
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0;padding-top:0}
  .row:last-child{padding-bottom:0}
  .name{font-weight:600}
  .meta{color:var(--muted);font-size:.88rem;margin-top:1px}
  .right{text-align:right;font-weight:600;white-space:nowrap}
  .tag{font-size:.74rem;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:8px;vertical-align:middle}
  .done{opacity:.45}
  .ok{color:var(--good)}.late{color:var(--warn)}.cancel{color:var(--bad)}
  .empty{color:var(--muted)}

  button,.btn{font:inherit;font-size:.88rem;font-weight:600;border:0;border-radius:99px;padding:8px 14px;
    background:var(--accent-soft);color:var(--accent);text-decoration:none;cursor:pointer;display:inline-block}
  .tools{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .foot{color:var(--muted);font-size:.8rem;margin:10px 4px 0}
  input[type=file]{display:none}
</style>
</head>
<body>

<header>
  <div class="eyebrow">At a glance</div>
  <h1 id="greeting">Hello</h1>
  <div class="date" id="date"></div>
</header>

<section class="card hero">
  <div class="label"><span>Bus · route 825</span><span id="busDay"></span></div>
  <div class="big" id="busCountdown">–</div>
  <div class="sub" id="busSub"></div>
  <div class="ring"><i id="busBar"></i></div>
</section>

<div class="glance">
  <div class="card"><div class="label">Next lesson</div><div class="v" id="gLesson">–</div><div class="s" id="gLessonS"></div></div>
  <div class="card"><div class="label">Next train</div><div class="v" id="gTrain">–</div><div class="s" id="gTrainS"></div></div>
</div>

<section class="card">
  <div class="label"><span id="lessonsTitle">Today</span></div>
  <div id="lessons"></div>
</section>

<section class="card">
  <div class="label"><span>Trains · Bolton</span><button id="refresh">Refresh</button></div>
  <div id="trains" class="empty">Loading…</div>
  <div class="foot" id="trainUpdated"></div>
</section>

<section class="card">
  <div class="label"><span>Timetable</span></div>
  <div class="meta" id="ttInfo"></div>
  <div class="tools">
    <label class="btn" for="icsFile">Import .ics</label>
    <input type="file" id="icsFile" accept=".ics,text/calendar">
    <button id="ttReset">Use built-in</button>
  </div>
</section>

<script src="timetable-data.js"></script>
<script>
const TZ = 'Europe/London';
const BUS_H = 7, BUS_M = 38, BUS_DAYS = [1,2,4,5];          // Mon Tue Thu Fri (no Wed, Sat, Sun)
const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const TRAIN_APIS = [
  'https://national-rail-api.davwheat.dev/departures/BON/8',
  'https://huxley2.azurewebsites.net/departures/BON/8?expand=true'
];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hm = d => d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:TZ});
const dayKey = d => d.toLocaleDateString('en-CA',{timeZone:TZ});

/* ---------- timetable ---------- */
function icsDate(s){
  const m = s.match(/(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)?(Z)?/); if(!m) return null;
  const a=[+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)];
  return m[7] ? new Date(Date.UTC(...a)) : new Date(...a);
}
function parseICS(text){
  text = text.replace(/\r?\n[ \t]/g,'');
  return text.split('BEGIN:VEVENT').slice(1).map(b=>{
    const g=k=>{const m=b.match(new RegExp('^'+k+'[^:\\n]*:(.*)$','m'));return m?m[1].trim().replace(/\\,/g,',').replace(/\\n/g,' '):''};
    return {s:icsDate(g('DTSTART')),e:icsDate(g('DTEND')),t:g('SUMMARY'),l:g('LOCATION'),who:g('DESCRIPTION').replace(/^Teacher:\s*/,'')};
  }).filter(x=>x.s).sort((a,b)=>a.s-b.s);
}
function loadEvents(){
  try{
    const saved = localStorage.getItem('tt-ics');
    if(saved){ const ev=parseICS(saved); if(ev.length) return {ev, src:'imported'}; }
  }catch(e){}
  const ev=(window.DEFAULT_TIMETABLE||[]).map(x=>({s:icsDate(x.s),e:icsDate(x.e),t:x.t,l:x.l,who:x.who}));
  return {ev, src:'built-in'};
}
let {ev:EVENTS, src:TT_SRC} = loadEvents();
const nice = t => t.replace(/^AL Y1\s+/,'').replace(/\s+\d+[A-Z]$/,'');

function renderTimetable(){
  const now = new Date(), today = dayKey(now);
  // lessons card: today if anything left, otherwise next day with lessons
  let key = today, title = 'Today';
  let list = EVENTS.filter(x=>dayKey(x.s)===today);
  if(!list.length || list.every(x=>(x.e||x.s) <= now)){
    const next = EVENTS.find(x=>dayKey(x.s)>today);
    if(next){ key = dayKey(next.s);
      const tmr = new Date(now.getTime()+864e5);
      title = key===dayKey(tmr) ? 'Tomorrow' : next.s.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short',timeZone:TZ});
      list = EVENTS.filter(x=>dayKey(x.s)===key);
    } else title = 'Lessons';
  }
  $('lessonsTitle').textContent = title;
  $('lessons').innerHTML = list.length ? list.map(x=>{
    const over = key===today && (x.e||x.s) <= now;
    const live = key===today && x.s <= now && now < x.e;
    return `<div class="row ${over?'done':''}"><div><div class="name">${esc(nice(x.t))}${live?'<span class="tag">Now</span>':''}</div>
      <div class="meta">${esc([x.l,x.who].filter(Boolean).join(' · '))}</div></div>
      <div class="right">${hm(x.s)}<div class="meta">${x.e?'to '+hm(x.e):''}</div></div></div>`;
  }).join('') : '<div class="empty">No lessons found in your timetable.</div>';

  // glance: next / current lesson
  const cur = EVENTS.find(x=>x.s<=now && now<x.e);
  const nxt = cur || EVENTS.find(x=>x.s>now);
  if(nxt){
    $('gLesson').textContent = nice(nxt.t);
    const sameDay = dayKey(nxt.s)===today;
    const when = cur ? `Now · until ${hm(nxt.e)}` :
      (sameDay ? 'Today ' : dayKey(nxt.s)===dayKey(new Date(now.getTime()+864e5)) ? 'Tomorrow ' :
        (nxt.s-now > 5*864e5 ? nxt.s.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:TZ})
          : nxt.s.toLocaleDateString('en-GB',{weekday:'short',timeZone:TZ}))+' ') + hm(nxt.s);
    $('gLessonS').textContent = when + (nxt.l?' · '+nxt.l:'');
  } else { $('gLesson').textContent='Nothing booked'; $('gLessonS').textContent=''; }

  const last = EVENTS.length ? EVENTS[EVENTS.length-1].s.toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:TZ}) : '';
  $('ttInfo').textContent = `${EVENTS.length} sessions · ${TT_SRC} · runs to ${last}. Lessons after that date won't show until you import a newer .ics.`;
}
$('icsFile').onchange = async e=>{
  const f=e.target.files[0]; if(!f) return;
  const text=await f.text(); const ev=parseICS(text);
  if(!ev.length){ $('ttInfo').textContent="That file doesn't look like a calendar (.ics)."; return; }
  try{ localStorage.setItem('tt-ics',text);}catch(_){}
  EVENTS=ev; TT_SRC='imported'; renderTimetable();
};
$('ttReset').onclick = ()=>{ try{localStorage.removeItem('tt-ics');}catch(_){} ({ev:EVENTS,src:TT_SRC}=loadEvents()); renderTimetable(); };

/* ---------- bus ---------- */
function nextBus(now){
  for(let i=0;i<8;i++){
    const d=new Date(now); d.setDate(d.getDate()+i); d.setHours(BUS_H,BUS_M,0,0);
    if(BUS_DAYS.includes(d.getDay()) && d>now) return d;
  }
}
function tick(){
  const now=new Date(), h=now.getHours();
  $('greeting').textContent = h<12 ? 'Good morning' : h<18 ? 'Good afternoon' : 'Good evening';
  $('date').textContent = now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',timeZone:TZ}) + ' · ' + hm(now);

  const bus=nextBus(now), secs=Math.floor((bus-now)/1000);
  const d=Math.floor(secs/86400), hh=Math.floor(secs%86400/3600), mm=Math.floor(secs%3600/60), ss=secs%60;
  let txt;
  if(secs<3600) txt = `${pad(mm)}:${pad(ss)}`;                 // last hour: minutes and seconds
  else if(d)    txt = `${d}d ${hh}h`;
  else          txt = `${hh}h ${pad(mm)}m`;
  $('busCountdown').textContent = txt;
  const tmr=new Date(now); tmr.setDate(now.getDate()+1);
  const day = bus.toDateString()===now.toDateString() ? 'today' : bus.toDateString()===tmr.toDateString() ? 'tomorrow' : DAYS[bus.getDay()];
  $('busDay').textContent = day==='today'||day==='tomorrow' ? day : DAYS[bus.getDay()];
  $('busSub').textContent = secs<3600 ? 'Time to head out' : `Leaves ${day} at 07:38`;
  // progress: fills over the final 12 hours
  $('busBar').style.width = Math.max(0,Math.min(100,(1-secs/43200)*100))+'%';
  renderTimetable();
}

/* ---------- trains ---------- */
async function getJSON(url){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),8000);
  try{ const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
async function loadTrains(){
  let data=null;
  for(const u of TRAIN_APIS){ try{ data=await getJSON(u); if(data) break; }catch(e){} }
  const el=$('trains');
  if(!data){
    el.innerHTML='<div class="empty">Live trains are unavailable right now.</div><div class="tools"><a class="btn" target="_blank" rel="noopener" href="https://www.nationalrail.co.uk/live-trains/departures/BON/">Open National Rail</a></div>';
    $('gTrain').textContent='–'; $('gTrainS').textContent='Unavailable'; return;
  }
  const svcs=data.trainServices||[];
  const destOf=s=>Array.isArray(s.destination)?(s.destination[0]?.locationName||'?'):(s.destination||'?');
  const info=s=>{
    const etd=s.etd||'';
    if(s.isCancelled||etd==='Cancelled') return {c:'cancel',t:'Cancelled'};
    if(etd==='Delayed') return {c:'late',t:'Delayed'};
    if(etd&&etd!=='On time') return {c:'late',t:'Exp '+etd};
    return {c:'ok',t:'On time'};
  };
  el.innerHTML = svcs.length ? svcs.map(s=>{const i=info(s);
    return `<div class="row"><div><div class="name">${esc(destOf(s))}</div><div class="meta">${esc(s.operator||'')}${s.platform?' · Platform '+esc(s.platform):''}</div></div>
    <div class="right">${esc(s.std)}<div class="meta ${i.c}">${i.t}</div></div></div>`;}).join('') : '<div class="empty">No departures listed.</div>';
  const first=svcs.find(s=>!s.isCancelled)||svcs[0];
  if(first){ const i=info(first); $('gTrain').textContent=first.std+' '+destOf(first); $('gTrainS').textContent=i.t+(first.platform?' · Plat '+first.platform:''); }
  $('trainUpdated').textContent='Updated '+hm(new Date());
}
$('refresh').onclick=loadTrains;

tick(); setInterval(tick,1000);
loadTrains(); setInterval(loadTrains,30000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
