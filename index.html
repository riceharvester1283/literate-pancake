<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>At a glance</title>
<style>
  :root{
    --bg:#000; --s1:#131314; --s2:#1e1f20; --s3:#282a2c; --line:#2d2f31;
    --ink:#e3e3e3; --muted:#9aa0a6; --primary:#a8c7fa; --on-primary:#062e6f; --pc:#0842a0;
    --warn:#fdd663; --good:#81c995; --bad:#f28b82;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#000}
  body{margin:0;color:var(--ink);font-family:"Google Sans","Google Sans Text","Product Sans",Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.35;padding:max(10px,env(safe-area-inset-top)) 16px 64px;max-width:560px;margin-inline:auto}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  svg.ic{width:24px;height:24px;fill:currentColor;flex:none}

  /* top bar */
  .top{display:flex;align-items:center;gap:14px;margin:6px 0 18px}
  .iconbtn{width:48px;height:48px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none}
  .top h1{font-size:1.75rem;font-weight:500;margin:0;line-height:1.1;letter-spacing:-.01em}
  .top .sub{color:var(--muted);font-size:.9rem;margin-top:2px}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
  .drawer{position:fixed;top:0;bottom:0;left:0;width:82%;max-width:320px;background:var(--s1);border-radius:0 28px 28px 0;
    transform:translateX(-102%);visibility:hidden;transition:transform .25s,visibility 0s .25s;z-index:11;padding:max(24px,env(safe-area-inset-top)) 12px 20px}
  body.menu .scrim{opacity:1;pointer-events:auto}
  body.menu .drawer{transform:none;visibility:visible;transition-delay:0s}
  .drawer h2{font-size:.9rem;font-weight:500;color:var(--muted);margin:6px 16px 14px}
  .drawer button{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:0 18px;height:56px;border-radius:28px;font-size:1rem;font-weight:500}
  .drawer button.on{background:var(--pc);color:#d3e3fd}

  .page{display:none} .page.on{display:block}

  /* tiles */
  .tile{background:var(--s2);border-radius:28px;padding:18px 20px;margin-bottom:12px}
  .tile.tap{cursor:pointer}
  .lab{font-size:.8rem;font-weight:500;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.02em}
  .v{font-size:1.45rem;font-weight:500;line-height:1.2;display:flex;align-items:center;gap:12px}
  .s{color:var(--muted);font-size:.92rem;margin-top:4px}
  .rem{margin-top:8px;font-weight:600;color:var(--c,var(--primary));font-size:1rem}
  .det{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.92rem}
  .det b{color:var(--muted);font-weight:500;margin-right:6px}
  .bar{height:8px;background:var(--s3);border-radius:8px;overflow:hidden;margin-top:12px}
  .bar i{display:block;height:100%;width:0;background:var(--c,var(--primary));border-radius:8px;transition:width .8s linear}
  .bar.thin{height:5px;margin-top:8px}
  .bus{display:flex;align-items:center;gap:14px;padding:14px 20px;border-radius:28px;background:var(--s2);margin-bottom:12px;cursor:pointer}
  .bus .t{font-weight:600;font-size:1.1rem;color:var(--primary)}
  .bus .m{color:var(--muted);font-size:.85rem}
  .bus .bi{width:40px;height:40px;border-radius:50%;background:var(--pc);color:#d3e3fd;display:grid;place-items:center;flex:none}
  .mini{background:var(--s2);border-radius:20px;padding:12px 18px;margin-bottom:12px}
  .mini .r{display:flex;justify-content:space-between;align-items:baseline;font-size:.85rem;color:var(--muted)}
  .mini b{font-size:1rem;color:var(--ink);font-weight:600}

  /* icon chips */
  .ib{width:44px;height:44px;border-radius:50%;background:color-mix(in srgb,var(--c) 24%,#000);color:var(--c);display:grid;place-items:center;flex:none}
  .ib.sm{width:36px;height:36px}.ib.sm svg{width:20px;height:20px}

  /* blocks */
  .blk{display:flex;gap:14px;align-items:center;margin-bottom:8px;padding:12px 16px 12px 12px;border-radius:24px;
    background:var(--s2);background:color-mix(in srgb,var(--c) 11%,#151516);cursor:pointer;transition:opacity .3s}
  .blk .bt{flex:1;min-width:0}
  .blk .bn{font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .blk .bm{color:var(--muted);font-size:.85rem;margin-top:1px}
  .blk .br{text-align:right;white-space:nowrap;font-weight:600;font-variant-numeric:tabular-nums;font-size:.95rem}
  .blk .br .bm{font-weight:400}
  .blk .nt{font-size:.82rem;color:#c4c7c5;margin-top:4px}
  .bdg{display:inline-flex;gap:4px}
  .bdg svg{width:17px;height:17px}
  .bdg .hw{color:var(--warn)} .bdg .nt2{color:var(--muted)}
  .blk.free{background:transparent;border:1.5px dashed var(--line);cursor:default;padding:8px 16px 8px 12px}
  .blk.free .ib{background:var(--s3);color:var(--muted)}
  .blk.free .bn{color:var(--muted);font-weight:500}
  .blk.past{opacity:.28}
  .blk.now{box-shadow:inset 0 0 0 2px var(--c)}
  .tag{font-size:.68rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--c);color:#000}
  .daytitle{font-size:.85rem;font-weight:500;color:var(--muted);margin:20px 6px 8px}
  .daytitle.today{color:var(--primary)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--s3);border-radius:99px;padding:0 20px;height:44px;font-weight:600;font-size:.92rem;text-decoration:none;color:var(--ink)}
  .btn.full{display:flex;width:100%;margin:6px 0 8px;height:52px}
  .btn.pri{background:var(--primary);color:var(--on-primary)}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .week{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .week .t{font-weight:600}
  .week .iconbtn{width:44px;height:44px}

  /* segmented */
  .seg{display:flex;border:1.5px solid var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
  .seg button{flex:1;height:44px;font-weight:600;font-size:.92rem;color:var(--muted)}
  .seg button.on{background:var(--pc);color:#d3e3fd}

  /* trains + bus page */
  .tr{display:grid;grid-template-columns:54px 1fr auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
  .tr:first-of-type{border-top:0}
  .tr .tm{font-weight:700;font-variant-numeric:tabular-nums}
  .tr .ds{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tr .st{font-size:.82rem;font-weight:500;text-align:right;white-space:nowrap}
  .ok{color:var(--good)}.late{color:var(--warn)}.cancel{color:var(--bad)}
  .bigbus{font-size:3rem;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--primary);line-height:1.1}
  .muted{color:var(--muted)}

  /* sheet */
  .sheet{position:fixed;left:0;right:0;bottom:0;background:var(--s1);border-radius:28px 28px 0 0;padding:22px 18px max(20px,env(safe-area-inset-bottom));
    transform:translateY(105%);visibility:hidden;transition:transform .25s,visibility 0s .25s;z-index:21;max-width:560px;margin-inline:auto}
  body.sheet-open .sheet{transform:none;visibility:visible;transition-delay:0s}
  body.sheet-open .scrim2{opacity:1;pointer-events:auto}
  .scrim2{position:fixed;inset:0;background:rgba(0,0,0,.65);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
  textarea,input[type=time]{width:100%;background:#000;color:var(--ink);border:1.5px solid var(--line);border-radius:18px;padding:14px;font:inherit;margin-top:10px}
  textarea:focus,input:focus{outline:2px solid var(--primary);border-color:transparent}
  textarea{min-height:90px;resize:vertical}
  .hwb{display:flex;align-items:center;gap:12px;margin-top:14px;width:100%;padding:0 18px;height:52px;border-radius:99px;background:var(--s3);font-weight:600}
  .hwb.on{background:var(--warn);color:#241a00}
  .set{display:flex;gap:12px}.set>div{flex:1}
  .set label{font-size:.8rem;color:var(--muted)}
  input[type=file]{display:none}
</style>
</head>
<body>

<div class="top">
  <button class="iconbtn" id="burger" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
  <div><h1 id="greeting">Hello</h1><div class="sub" id="date"></div></div>
</div>

<div class="scrim" id="scrim"></div>
<nav class="drawer">
  <h2>Menu</h2>
  <button data-go="home" data-icon="home">At a glance</button>
  <button data-go="bus" data-icon="bus">Buses</button>
  <button data-go="trains" data-icon="train">Trains</button>
  <button data-go="tt" data-icon="cal">Timetable</button>
  <button data-go="set" data-icon="gear">Settings</button>
</nav>

<!-- HOME -->
<main class="page on" id="pg-home">
  <div class="bus" data-go="bus">
    <span class="bi" data-icon="bus"></span>
    <div><div class="t" id="cBus">–</div><div class="m" id="cBusM">Bus 825</div></div>
  </div>

  <div class="tile tap" id="nextTile">
    <div class="lab">Next event</div>
    <div class="v" id="nName">–</div>
    <div class="s" id="nWhen"></div>
    <div class="det" id="nDet"></div>
  </div>

  <div class="tile tap" id="curTile">
    <div class="lab">Current event</div>
    <div class="v" id="cName">None</div>
    <div class="rem" id="cRem" hidden></div>
    <div class="bar" id="cBarWrap" hidden><i id="cBar"></i></div>
    <div class="det" id="cDet" hidden></div>
  </div>

  <div class="mini">
    <div class="r"><span>Day in progress</span><b id="pPct">0%</b></div>
    <div class="bar thin"><i id="pBar"></i></div>
  </div>

  <div class="daytitle" id="homeDayTitle">Today</div>
  <div id="homeDay"></div>
  <button class="btn full pri" data-go="tt">View full timetable</button>
</main>

<!-- BUSES -->
<main class="page" id="pg-bus">
  <div class="tile">
    <div class="lab"><span>Route 825</span><span id="busDay"></span></div>
    <div class="bigbus" id="busBig">–</div>
    <div class="s" id="busSub"></div>
    <div class="bar"><i id="busBar"></i></div>
  </div>
  <div class="s" style="margin:0 8px">Runs Mon, Tue, Thu, Fri · none on Wednesdays or weekends.</div>
</main>

<!-- TRAINS -->
<main class="page" id="pg-trains">
  <div class="seg" id="stSeg">
    <button data-st="BON">Bolton</button>
    <button data-st="LEY">Leyland</button>
  </div>
  <div class="tile">
    <div class="lab"><span id="stName">Departures</span><button class="btn" id="refresh" style="height:36px;padding:0 14px;font-size:.8rem">Refresh</button></div>
    <div id="trains" class="muted">Loading…</div>
    <div class="s" id="trainUpdated"></div>
  </div>
</main>

<!-- TIMETABLE -->
<main class="page" id="pg-tt">
  <div class="week">
    <button class="iconbtn" id="wPrev" aria-label="Previous week"><svg class="ic" viewBox="0 0 24 24"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg></button>
    <div class="t" id="wTitle"></div>
    <button class="iconbtn" id="wNext" aria-label="Next week"><svg class="ic" viewBox="0 0 24 24"><path d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg></button>
  </div>
  <div class="row" style="margin:0 0 4px;justify-content:center"><button class="btn" id="wToday">This week</button></div>
  <div id="ttWeek"></div>
</main>

<!-- SETTINGS -->
<main class="page" id="pg-set">
  <div class="tile">
    <div class="lab">College day</div>
    <div class="set">
      <div><label>Starts</label><input type="time" id="setStart"></div>
      <div><label>Finishes</label><input type="time" id="setEnd"></div>
    </div>
    <div class="s">Gaps between lessons inside this window show as Free.</div>
  </div>
  <div class="tile">
    <div class="lab">Timetable</div>
    <div class="s" id="ttInfo" style="margin-top:0"></div>
    <div class="row">
      <label class="btn" for="icsFile">Import .ics</label><input type="file" id="icsFile" accept=".ics,text/calendar">
      <button class="btn" id="ttReset">Use built-in</button>
    </div>
  </div>
  <div class="tile">
    <div class="lab">Notes &amp; homework</div>
    <div class="s" style="margin-top:0">Saved on this phone only.</div>
    <div class="row"><button class="btn" id="notesClear">Clear all notes</button></div>
  </div>
</main>

<!-- NOTE SHEET -->
<div class="scrim2" id="scrim2"></div>
<div class="sheet" id="sheet">
  <div class="lab" id="shLab">Lesson</div>
  <div class="v" id="shTitle"></div>
  <div class="s" id="shSub"></div>
  <button class="hwb" id="shHw"><span data-icon="hw"></span><span id="shHwTxt">Mark as homework</span></button>
  <textarea id="shNote" placeholder="Class note or homework reminder…"></textarea>
  <div class="row"><button class="btn pri" id="shSave">Save</button><button class="btn" id="shClose">Cancel</button></div>
</div>

<script src="timetable-data.js"></script>
<script>

const pad = n => String(n).padStart(2,'0');

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

  get(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} },
  raw(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  setRaw(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

  gear: 'M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z'
};
const icon = (n,cls='') => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true"><path d="${P[n]}"/></svg>`;
// fill every placeholder / prefix that declares data-icon
function paintIcons(){
  document.querySelectorAll('[data-icon]').forEach(el=>{
    const html = icon(el.dataset.icon);
    if(el.tagName==='BUTTON') el.insertAdjacentHTML('afterbegin',html); else el.innerHTML = html;
    el.removeAttribute('data-icon');
  });
}

/* ---------- settings + notes ---------- */
let SET = Object.assign({start:'09:00', end:'15:40'}, store.get('settings',{}));
let NOTES = store.get('notes',{});

/* ---------- timetable data ---------- */
function icsDate(s){
  const m = s.match(/(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)?(Z)?/); if(!m) return null;
  const a=[+m[1],m[2]-1,+m[3],+m[4],+m[5],+(m[6]||0)];
  return m[7] ? new Date(Date.UTC(...a)) : new Date(...a);
}
function parseICS(text){
  text = text.replace(/\r?\n[ \t]/g,'');
  return text.split('BEGIN:VEVENT').slice(1).map(b=>{
    const g=k=>{const m=b.match(new RegExp('^'+k+'[^:\\n]*:(.*)$','m'));return m?m[1].trim().replace(/\\,/g,',').replace(/\\n/g,' '):''};
    return {s:icsDate(g('DTSTART')),e:icsDate(g('DTEND')),t:g('SUMMARY'),l:g('LOCATION'),who:g('DESCRIPTION').replace(/^Teacher:\s*/,'')};
  }).filter(x=>x.s && x.e).sort((a,b)=>a.s-b.s);
}
function loadEvents(){
  const saved = store.raw('tt-ics');
  if(saved){ const ev=parseICS(saved); if(ev.length) return {ev,src:'imported'}; }
  return {ev:(window.DEFAULT_TIMETABLE||[]).map(x=>({s:icsDate(x.s),e:icsDate(x.e),t:x.t,l:x.l,who:x.who})), src:'built-in'};
}
let {ev:EVENTS, src:TT_SRC} = loadEvents();
const nice = t => t.replace(/^AL Y1\s+/,'').replace(/\s+\d+[A-Z]$/,'');
const evKey = x => x.s.toISOString()+'|'+x.t;

/* subject -> colour + icon */
const EXTRA = [['#fdd663','book'],['#78d9ec','book'],['#ff8bcb','book'],['#c0ca33','book'],['#fcad70','book']];
function subj(title){
  const n = nice(title).toLowerCase();
  if(n.includes('politic'))  return {c:'#f28b82', i:'gov'};
  if(n.includes('geograph')) return {c:'#81c995', i:'globe'};
  if(n.includes('econom'))   return {c:'#8ab4f8', i:'chart'};
  if(n.includes('mentor'))   return {c:'#d7aefb', i:'person'};
  if(n.includes('focus'))    return {c:'#d7aefb', i:'group'};
  if(n.includes('appointment')) return {c:'#d7aefb', i:'event'};
  let h=0; for(const c of n) h=(h*31+c.charCodeAt(0))>>>0;
  const e=EXTRA[h%EXTRA.length]; return {c:e[0], i:e[1]};
}

/* day -> blocks (lessons + Free) */
function dayBlocks(key){
  const evs = EVENTS.filter(x=>dkey(x.s)===key);
  if(!evs.length) return null;
  const d = evs[0].s;
  const start = new Date(Math.min(atHM(d,SET.start), evs[0].s));
  const end   = new Date(Math.max(atHM(d,SET.end), Math.max(...evs.map(x=>+x.e))));
  const out=[]; let cur=start;
  for(const ev of evs){
    if(ev.s-cur >= 5*60000) out.push({free:true,s:cur,e:ev.s});
    out.push({free:false,s:ev.s,e:ev.e,ev});
    if(ev.e>cur) cur=ev.e;
  }
  if(end-cur >= 5*60000) out.push({free:true,s:cur,e:end});
  return {blocks:out,start,end};
}
function badges(k){
  const n=NOTES[k]||{};
  return (n.hw||n.note) ? `<span class="bdg">${n.hw?`<span class="hw">${icon('hw')}</span>`:''}${n.note?`<span class="nt2">${icon('note')}</span>`:''}</span>` : '';
}
function blockHTML(b,now){
  const range = hm(b.s)+'–'+hm(b.e), d = dur(b.e-b.s);
  const past = b.e<=now, live = b.s<=now && now<b.e;
  if(b.free) return `<div class="blk free ${past?'past':''}" style="--c:#9aa0a6"><span class="ib sm">${icon('cafe')}</span>
    <div class="bt"><div class="bn">Free${live?'<span class="tag" style="--c:#9aa0a6">Now</span>':''}</div></div>
    <div class="br">${range}<div class="bm">${d}</div></div></div>`;
  const x=b.ev, k=evKey(x), n=NOTES[k]||{}, sj=subj(x.t);
  return `<div class="blk ${past?'past':''} ${live?'now':''}" style="--c:${sj.c}" data-k="${esc(k)}">
    <span class="ib">${icon(sj.i)}</span>
    <div class="bt"><div class="bn">${esc(nice(x.t))}${badges(k)}${live?'<span class="tag">Now</span>':''}</div>
    <div class="bm">${esc([x.l,x.who].filter(Boolean).join(' · '))}</div>${n.note?`<div class="nt">${esc(n.note)}</div>`:''}</div>
    <div class="br">${range}<div class="bm">${d}</div></div></div>`;
}

/* ---------- home ---------- */
const rel = (d,now) => dkey(d)===dkey(now) ? 'Today' : dkey(d)===dkey(new Date(now.getTime()+864e5)) ? 'Tomorrow'
    : (d-now > 5*864e5 ? d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}) : DAYS[d.getDay()]);
const mins = ms => { const m=Math.ceil(ms/60000); return m>=60 ? Math.floor(m/60)+'h '+(m%60?pad(m%60)+'m':'') : (m<=1?'1 min':m+' mins'); };

function renderCurrent(now=new Date()){
  const cur = EVENTS.find(x=>x.s<=now && now<x.e);
  const tile=$('curTile'), wrap=$('cBarWrap'), rem=$('cRem');
  if(cur){
    const sj=subj(cur.t), k=evKey(cur);
    tile.style.setProperty('--c',sj.c); tile.dataset.k=k;
    $('cName').innerHTML = `<span class="ib sm" style="--c:${sj.c}">${icon(sj.i)}</span><span>${esc(nice(cur.t))}</span>${badges(k)}`;
    rem.hidden=false; rem.textContent = mins(cur.e-now)+' remaining';
    wrap.hidden=false; $('cBar').style.width = Math.max(0,Math.min(100,(now-cur.s)/(cur.e-cur.s)*100))+'%';
    $('cDet').hidden=false; $('cDet').innerHTML = `<b>Details</b>${esc([cur.l,cur.who].filter(Boolean).join(' · ')||'–')}`;
  } else {
    delete tile.dataset.k; tile.style.removeProperty('--c');
    $('cName').textContent='None'; $('cDet').hidden=true;
    const day=dayBlocks(dkey(now)), free = day && day.blocks.find(b=>b.free && b.s<=now && now<b.e);
    if(free){
      rem.hidden=false; rem.style.setProperty('--c','#9aa0a6'); rem.textContent = `Free · ${mins(free.e-now)} until ${hm(free.e)}`;
      wrap.hidden=false; tile.style.setProperty('--c','#9aa0a6'); $('cBar').style.width = Math.max(0,Math.min(100,(now-free.s)/(free.e-free.s)*100))+'%';
    } else { rem.hidden=true; wrap.hidden=true; }
  }
}

function renderHome(now=new Date()){
  const nxt = EVENTS.find(x=>x.s>now), nt=$('nextTile');
  if(nxt){
    const sj=subj(nxt.t), k=evKey(nxt); nt.dataset.k=k;
    $('nName').innerHTML = `<span class="ib sm" style="--c:${sj.c}">${icon(sj.i)}</span><span>${esc(nice(nxt.t))}</span>${badges(k)}`;
    $('nWhen').textContent = `${rel(nxt.s,now)} · ${hm(nxt.s)}–${hm(nxt.e)} · ${dur(nxt.e-nxt.s)}`;
    $('nDet').innerHTML = `<b>Details</b>${esc([nxt.l,nxt.who].filter(Boolean).join(' · ')||'–')}`;
  } else { delete nt.dataset.k; $('nName').textContent='Nothing booked'; $('nWhen').textContent=''; $('nDet').innerHTML=''; }
  renderCurrent(now);

  // day shown: today, else next day with lessons
  let key = dkey(now), day = dayBlocks(key), title = 'Today · '+now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'});
  if(!day){
    const n = EVENTS.find(x=>x.s>now);
    if(n){ key=dkey(n.s); day=dayBlocks(key); title = rel(n.s,now)+' · '+n.s.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short'}); }
  }
  $('homeDayTitle').textContent = title;
  $('homeDay').innerHTML = day ? day.blocks.map(b=>blockHTML(b,now)).join('') : '<div class="muted" style="padding:6px 8px">No lessons found.</div>';

  const tdy = dayBlocks(dkey(now));
  if(tdy){ const p=Math.max(0,Math.min(1,(now-tdy.start)/(tdy.end-tdy.start))); $('pPct').textContent=Math.round(p*100)+'%'; $('pBar').style.width=(p*100)+'%'; }
  else { $('pPct').textContent='No lessons today'; $('pBar').style.width='0'; }
}

/* ---------- full timetable ---------- */
let weekStart = mondayOf(new Date());
function mondayOf(d){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); const wd=x.getDay(); x.setDate(x.getDate()+(wd===0?1:wd===6?2:1-wd)); return x; }
function renderWeek(now=new Date()){
  const fri = new Date(weekStart); fri.setDate(fri.getDate()+4);
  $('wTitle').textContent = weekStart.toLocaleDateString('en-GB',{day:'numeric',month:'short'})+' – '+fri.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  let html='';
  for(let i=0;i<5;i++){
    const d=new Date(weekStart); d.setDate(d.getDate()+i);
    const key=dkey(d), day=dayBlocks(key), isToday=key===dkey(now);
    html += `<div class="daytitle ${isToday?'today':''}">${DAYS[d.getDay()]} ${d.getDate()} ${d.toLocaleDateString('en-GB',{month:'short'})}</div>`;
    html += day ? day.blocks.map(b=>blockHTML(b,now)).join('') : '<div class="muted" style="padding:2px 8px 6px">No lessons</div>';
  }
  $('ttWeek').innerHTML = html;
}
$('wPrev').onclick=()=>{ weekStart.setDate(weekStart.getDate()-7); renderWeek(); };
$('wNext').onclick=()=>{ weekStart.setDate(weekStart.getDate()+7); renderWeek(); };
$('wToday').onclick=()=>{ weekStart=mondayOf(new Date()); renderWeek(); };

/* ---------- notes sheet ---------- */
let editKey=null, editHw=false;
function openSheet(k){
  const x = EVENTS.find(e=>evKey(e)===k); if(!x) return;
  editKey=k; const n=NOTES[k]||{}; editHw=!!n.hw;
  $('shTitle').textContent = nice(x.t);
  $('shSub').textContent = `${DAYS[x.s.getDay()]} ${x.s.getDate()} ${x.s.toLocaleDateString('en-GB',{month:'short'})} · ${hm(x.s)}–${hm(x.e)}`;
  $('shNote').value = n.note||''; paintHw();
  document.body.classList.add('sheet-open');
}
function paintHw(){ $('shHw').classList.toggle('on',editHw); $('shHwTxt').textContent = editHw ? 'Homework set' : 'Mark as homework'; }
function closeSheet(){ document.body.classList.remove('sheet-open'); editKey=null; }
$('shHw').onclick=()=>{ editHw=!editHw; paintHw(); };
$('shClose').onclick=closeSheet; $('scrim2').onclick=closeSheet;
$('shSave').onclick=()=>{
  const note=$('shNote').value.trim();
  if(note||editHw) NOTES[editKey]={note,hw:editHw}; else delete NOTES[editKey];
  store.set('notes',NOTES); closeSheet(); renderAll();
};
document.addEventListener('click',e=>{ const b=e.target.closest('[data-k]'); if(b && b.dataset.k) openSheet(b.dataset.k); });

/* ---------- bus ---------- */
const BUS_DAYS=[1,2,4,5];
function nextBus(now){
  for(let i=0;i<8;i++){ const d=new Date(now); d.setDate(d.getDate()+i); d.setHours(7,38,0,0); if(BUS_DAYS.includes(d.getDay()) && d>now) return d; }
}
function busText(secs){
  const d=Math.floor(secs/86400), h=Math.floor(secs%86400/3600), m=Math.floor(secs%3600/60), s=secs%60;
  return secs<3600 ? pad(m)+':'+pad(s) : d ? d+'d '+h+'h' : h+'h '+pad(m)+'m';
}
function renderBus(now=new Date()){
  const bus=nextBus(now), secs=Math.floor((bus-now)/1000), t=busText(secs);
  const tmr=new Date(now); tmr.setDate(now.getDate()+1);
  const day = bus.toDateString()===now.toDateString() ? 'Today' : bus.toDateString()===tmr.toDateString() ? 'Tomorrow' : DAYS[bus.getDay()];
  $('cBus').textContent = t; $('cBusM').textContent = `Bus 825 · ${day} 07:38`;
  $('busBig').textContent = t; $('busDay').textContent = day; $('busSub').textContent = '07:38 · '+day;
  $('busBar').style.width = Math.max(0,Math.min(100,(1-secs/43200)*100))+'%';
}

/* ---------- trains ---------- */
const STATIONS = {BON:'Bolton', LEY:'Leyland'};
let station = STATIONS[store.raw('station')] ? store.raw('station') : 'BON';
const trainURLs = c => [`https://national-rail-api.davwheat.dev/departures/${c}/8`, `https://huxley2.azurewebsites.net/departures/${c}/8?expand=true`];
async function getJSON(url){
  const c=new AbortController(), t=setTimeout(()=>c.abort(),8000);
  try{ const r=await fetch(url,{signal:c.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); } finally{ clearTimeout(t); }
}
function paintSeg(){ document.querySelectorAll('#stSeg button').forEach(b=>b.classList.toggle('on',b.dataset.st===station)); $('stName').textContent = STATIONS[station]+' departures'; }
async function loadTrains(){
  const want=station; let data=null;
  for(const u of trainURLs(want)){ try{ data=await getJSON(u); if(data) break; }catch(e){} }
  if(want!==station) return;                      // user switched while loading
  const el=$('trains');
  if(!data){
    el.innerHTML=`Live trains unavailable right now. <div class="row"><a class="btn" target="_blank" rel="noopener" href="https://www.nationalrail.co.uk/live-trains/departures/${want}/">Open National Rail</a></div>`;
    return;
  }
  const svcs=(data.trainServices||[]).slice(0,6);
  const dest=s=>Array.isArray(s.destination)?(s.destination[0]?.locationName||'?'):(s.destination||'?');
  const info=s=>{ const e=s.etd||'';
    if(s.isCancelled||e==='Cancelled') return {c:'cancel',t:'Cancelled'};
    if(e==='Delayed') return {c:'late',t:'Delayed'};
    if(e&&e!=='On time') return {c:'late',t:'Exp '+e};
    return {c:'ok',t:'On time'}; };
  el.innerHTML = svcs.length ? svcs.map(s=>{const i=info(s);
    return `<div class="tr"><div class="tm">${esc(s.std)}</div><div class="ds">${esc(dest(s))}${s.platform?` <span class="muted">· P${esc(s.platform)}</span>`:''}</div><div class="st ${i.c}">${i.t}</div></div>`;}).join('') : 'No departures listed.';
  $('trainUpdated').textContent='Updated '+hm(new Date());
}
document.querySelectorAll('#stSeg button').forEach(b=>b.onclick=()=>{
  station=b.dataset.st; store.setRaw('station',station); paintSeg(); $('trains').textContent='Loading…'; $('trainUpdated').textContent=''; loadTrains();
});
$('refresh').onclick=loadTrains;

/* ---------- settings ---------- */
$('setStart').value=SET.start; $('setEnd').value=SET.end;
$('setStart').onchange=$('setEnd').onchange=()=>{ SET.start=$('setStart').value||'09:00'; SET.end=$('setEnd').value||'15:40'; store.set('settings',SET); renderAll(); };
function renderSettings(){
  const last = EVENTS.length ? EVENTS[EVENTS.length-1].e.toLocaleDateString('en-GB',{day:'numeric',month:'short'}) : '–';
  $('ttInfo').textContent = `${EVENTS.length} sessions · ${TT_SRC} · runs to ${last}`;
}
$('icsFile').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  const text=await f.text(), ev=parseICS(text);
  if(!ev.length){ $('ttInfo').textContent="That file doesn't look like a calendar (.ics)."; return; }
  store.setRaw('tt-ics',text); EVENTS=ev; TT_SRC='imported'; renderAll();
};
$('ttReset').onclick=()=>{ store.del('tt-ics'); ({ev:EVENTS,src:TT_SRC}=loadEvents()); renderAll(); };
$('notesClear').onclick=()=>{ if(confirm('Clear all notes and homework tags?')){ NOTES={}; store.set('notes',NOTES); renderAll(); } };

/* ---------- nav ---------- */
function go(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='pg-'+id));
  document.querySelectorAll('.drawer [data-go]').forEach(b=>b.classList.toggle('on',b.dataset.go===id));
  document.body.classList.remove('menu'); window.scrollTo(0,0);
  if(id==='tt') weekStart=mondayOf(new Date());
  if(id==='trains') loadTrains();
  renderAll();
}
document.addEventListener('click',e=>{ const g=e.target.closest('[data-go]'); if(g) go(g.dataset.go); });
$('burger').onclick=()=>document.body.classList.add('menu');
$('scrim').onclick=()=>document.body.classList.remove('menu');

/* ---------- loop ---------- */
function renderAll(){ const now=new Date(); renderHome(now); renderWeek(now); renderBus(now); renderSettings(); }
let lastMin=-1;
function tick(){
  const now=new Date(), h=now.getHours();
  $('greeting').textContent = h<12?'Good morning':h<18?'Good afternoon':'Good evening';
  $('date').textContent = now.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})+' · '+hm(now);
  renderBus(now); renderCurrent(now);
  if(now.getMinutes()!==lastMin){ lastMin=now.getMinutes(); renderHome(now); if($('pg-tt').classList.contains('on')) renderWeek(now); }
}
paintIcons(); paintSeg(); renderAll(); tick(); setInterval(tick,1000);
loadTrains(); setInterval(()=>{ if($('pg-trains').classList.contains('on')) loadTrains(); },30000);
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
